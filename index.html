<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شركة العالمية | النظام المالي المتطور</title>
    <style>
        :root { --primary: #0284c7; --gold: #d4af37; --danger: #ef4444; --success: #10b981; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; direction: rtl; }
        .card { max-width: 1100px; margin: auto; background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .alert-row { background: #fee2e2 !important; border-right: 5px solid var(--danger); }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-box { padding: 20px; border-radius: 15px; background: var(--primary); color: white; text-align: center; }
        .btn-action { padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align: center; color: var(--primary);">شركة العالمية - إدارة الأستاذ بلال عبد الرزاق</h2>
    
    <!-- لوحة المدير للمراقبة -->
    <div id="managerPanel" style="display:none;">
        <div class="stats-grid">
            <div class="stat-box" style="background:var(--success)">إجمالي القبض: <span id="totalIncome">0</span>$</div>
            <div class="stat-box" style="background:var(--danger)">إجمالي المصاريف: <span id="totalExpense">0</span>$</div>
            <div class="stat-box" style="background:var(--gold)">الصافي الفعلي: <span id="netProfit">0</span>$</div>
        </div>
        <h3 style="color:var(--danger);">سجل التحذيرات (الإلغاءات):</h3>
        <div id="alertLog" style="margin-bottom:20px; padding:15px; background:#fff1f1; border-radius:10px;"></div>
    </div>

    <!-- جدول الحركات -->
    <table width="100%" border="1" style="border-collapse:collapse; margin-top:20px;">
        <thead>
            <tr style="background:#eee;">
                <th>الوصل</th>
                <th>الجابي</th>
                <th>الزبون</th>
                <th>المبلغ</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    // عند تسجيل حركة جديدة، يتم إضافة ميزة "النسخ" لاحقاً
    function updateDashboard() {
        let records = JSON.parse(localStorage.getItem("shippData") || "[]");
        let income = 0, expense = 0;
        let alertHtml = "";

        records.forEach(r => {
            if(r.status.includes('ملغي')) {
                alertHtml += `<p>⚠️ الوصل ${r.code} للجابي ${r.collector} أُلغي بسبب: ${r.status}</p>`;
            } else {
                if(r.type === 'مصروف') expense += parseFloat(r.amount);
                else income += parseFloat(r.amount);
            }
        });

        document.getElementById('totalIncome').innerText = income.toFixed(2);
        document.getElementById('totalExpense').innerText = expense.toFixed(2);
        document.getElementById('netProfit').innerText = (income - expense).toFixed(2);
        document.getElementById('alertLog').innerHTML = alertHtml || "لا توجد عمليات إلغاء اليوم.";
    }

    // عرض الجدول مع تلوين الإلغاءات باللون الأحمر (ميزة رقم 3)
    function loadTable() {
        let records = JSON.parse(localStorage.getItem("shippData") || "[]");
        let tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        
        records.forEach(r => {
            let rowClass = r.status.includes('ملغي') ? 'alert-row' : '';
            tbody.innerHTML += `
                <tr class="${rowClass}">
                    <td>${r.code}</td>
                    <td>${r.collector}</td>
                    <td>${r.name}</td>
                    <td>${r.amount}$</td>
                    <td>${r.status}</td>
                </tr>`;
        });
        updateDashboard();
    }
    
    // تشغيل اللوحة (إذا كان المدير هو المستخدم)
    if(localStorage.getItem("currentUser") === "manager") {
        document.getElementById("managerPanel").style.display = "grid";
    }
    loadTable();
</script>

</body>
</html>
