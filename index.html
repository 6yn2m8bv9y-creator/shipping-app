<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة العالمية - نظام الإدارة السحابي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #0284c7; --gold: #d4af37; --success: #10b981; --danger: #ef4444; --border: #cbd5e1; --card-bg: #ffffff; --text-color: #0f172a; }
        [data-theme="dark"] { --card-bg: #111827; --text-color: #f8fafc; --border: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); min-height: 100vh; margin: 0; padding: 20px; color: var(--text-color); }
        .card { max-width: 1100px; margin: auto; background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid var(--border); }
        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; font-size: 13px; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg); color: var(--text-color); }
        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-gold { background: linear-gradient(135deg, #d4af37, #b45309); }
        .btn-settle { background: var(--success); width: 100%; padding: 10px; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border-bottom: 1px solid var(--border); padding: 12px; text-align: center; font-size: 13px; }
        .type-pill { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .type-حوالة { background: rgba(16,185,129,0.2); color: #10b981; }
        .type-شحن { background: rgba(2,132,199,0.2); color: #0284c7; }
        .type-مصروف { background: rgba(239,68,68,0.2); color: #ef4444; }
    </style>
</head>
<body data-theme="dark">

    <!-- باقي الكود كما هو (تسجيل الدخول واللوحات)، فقط استبدل دالة addData ودالة settleCollector بالتالي: -->

    <script>
        // ... (كود الـ Firebase والـ Setup يبقى كما هو) ...

        function addData() {
            let name = document.getElementById("clientName").value.trim();
            let amount = parseFloat(document.getElementById("amount").value) || 0;
            let discount = parseFloat(document.getElementById("discount")?.value || 0); // إضافة الحسم
            let netAmount = amount - discount;
            
            if(!name || amount <= 0) { alert("الرجاء ملء كافة الحقول!"); return; }
            
            let receiptCode = generateReceiptCodeForCollector(currentCollectorLoggedIn, globalRecords);
            
            db.collection("shippings").add({
                code: receiptCode,
                collector: currentCollectorLoggedIn,
                type: document.getElementById("type").value,
                name: name,
                amount: netAmount.toFixed(2),
                originalAmount: amount.toFixed(2),
                discount: discount.toFixed(2),
                status: "مقبوض",
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                date: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})
            }).then(() => {
                alert("تم تسجيل الحركة بنجاح! الوصل: " + receiptCode);
            });
        }

        async function settleCollector(collectorName, expectedAmount) {
            if(!confirm(`هل أنت متأكد من تسوية صندوق (${collectorName}) وتصفير المعاملات وأرشفتها؟`)) return;

            // 1. أرشفة كافة الحركات النشطة للجابي
            let activeRecords = globalRecords.filter(r => r.collector === collectorName && r.status === "مقبوض");
            let batch = db.batch();
            activeRecords.forEach(r => {
                let ref = db.collection("shippings").doc(r.id);
                batch.update(ref, { status: "مؤرشف (" + new Date().toLocaleDateString() + ")" });
            });
            await batch.commit();

            // 2. إنشاء الـ PDF للمشاركة (تتضمن ملخص التسوية)
            generateAndShareSettlementPDF(collectorName, expectedAmount, activeRecords);
            alert("تمت الأرشفة وتصفير الصندوق بنجاح!");
        }

        // ملاحظة: أضف خانة الحسم في HTML كالتالي:
        // <div class="form-group"><label>حسم (خصم):</label><input type="number" id="discount" value="0"></div>

        // ... (باقي الدوال كما هي) ...
    </script>
</body>
</html>
