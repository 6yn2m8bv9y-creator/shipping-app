<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة العالمية - الإدارة الحديثة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #f1f5f9; --card-bg: #ffffff; --text-main: #1e293b; 
            --accent-blue: #0ea5e9; --accent-gold: #ca8a04; --border-color: #e2e8f0;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 900px; margin: auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin-bottom: 20px; }
        
        /* اللوغو والترويسة */
        .brand-header { text-align: center; margin-bottom: 20px; }
        .logo-badge { width: 70px; height: 70px; margin: 0 auto 10px; border-radius: 50%; background: var(--accent-blue); color: white; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        
        /* التبويبات */
        .manager-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .m-tab-btn { flex: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; background: white; color: #64748b; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .m-tab-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #f8fafc; padding: 12px; border-bottom: 2px solid var(--border-color); color: #475569; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); text-align: center; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- اللوغو أعدناه -->
        <div class="brand-header">
            <div class="logo-badge"><i class="fas fa-globe-americas"></i></div>
            <h2 style="margin:0;">شركة العالمية</h2>
            <p style="color:#64748b; font-size:12px;">إدارة الحاج بلال عبد الرزاق</p>
        </div>

        <div class="card">
            <div class="manager-tabs">
                <button class="m-tab-btn active" onclick="showTab('tab1', this)"><i class="fas fa-wallet"></i> الصناديق</button>
                <button class="m-tab-btn" onclick="showTab('tab2', this)"><i class="fas fa-cogs"></i> الإعدادات</button>
            </div>
            
            <div id="tab1" class="tab-content active">
                <p style="text-align:center; color:#64748b;">جاري تحميل بيانات الصناديق...</p>
            </div>
            <div id="tab2" class="tab-content">
                <p style="text-align:center; color:#64748b;">إعدادات النظام والتحكم...</p>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>الوصل</th>
                        <th>الجابي</th>
                        <th>المبلغ</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="4" style="color:#94a3b8;">لا توجد بيانات حالياً</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function showTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.m-tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
