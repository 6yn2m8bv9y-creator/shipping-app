<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شركة العالمية</title>
    <style>
        :root { --primary: #0284c7; --gold: #d4af37; --dark: #0f172a; }
        body { font-family: sans-serif; background: #f0f9ff; margin: 0; padding: 20px; direction: rtl; }
        .card { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="image_2.png" style="width: 100px; display: block; margin: auto;" onerror="this.style.display='none'">
        <h2>شركة العالمية - النظام الجديد</h2>
        <p style="text-align: center;">إذا ظهرت هذه الرسالة، فهذا يعني أن الكود الجديد تم رفعه بنجاح.</p>
        <button class="btn" onclick="alert('النظام يعمل بنجاح!')">تحقق من الاتصال</button>
    </div>
</body>
</html>
