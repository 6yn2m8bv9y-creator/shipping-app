<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الشحن والحوالات - العالمية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #bf9b30;
            --primary-dark: #9a7f27;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 950px;
            margin: auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        /* --- شاشة تسجيل الدخول والشعار --- */
        .login-box {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo-container img {
            max-width: 130px;
            height: auto;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
            margin-bottom: 15px;
        }
        .logo-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .logo-subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .login-inputs input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-dark); }
        
        /* --- لوحة التحكم الرئيسية --- */
        #appDashboard { display: none; }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fffbeb;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #fde68a;
        }
        .form-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
        }
        .form-section h3 {
            margin-top: 0;
            color: #334155;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        input, select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-add { background-color: var(--success); color: white; }
        .btn-add:hover { background-color: #059669; }
        .manager-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .btn-pdf { background-color: var(--primary); color: white; width: auto; }
        .btn-close { background-color: var(--danger); color: white; width: auto; }
        .btn-wa { background-color: #25d366; color: white; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; width: auto; padding: 10px 20px; border-radius: 8px; font-weight: bold;}
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
        }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; }
        .status-green { color: var(--success); background: #ecfdf5; padding: 4px 10px; border-radius: 20px; display: inline-block; font-size: 13px; }
        .status-red { color: var(--danger); background: #fef2f2; padding: 4px 10px; border-radius: 20px; display: inline-block; font-size: 13px; }
        .action-btn {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            background: #e2e8f0;
            border: none;
            cursor: pointer;
        }
        .action-btn:hover { background: #cbd5e1; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول الخارجية -->
    <div id="loginScreen" class="login-box">
        <div class="logo-container">
            <img src="image_1.png" alt="شعار العالمية">
            <div class="logo-title">العالمية</div>
            <div class="logo-subtitle">نظام إدارة الشحن والحوالات</div>
        </div>
        <div class="login-inputs">
            <input type="text" id="loginUser" placeholder="اسم المستخدم (manager أو collector)">
            <input type="password" id="loginPass" placeholder="كلمة المرور">
            <button class="btn btn-primary" onclick="handleLogin()">تسجيل الدخول</button>
        </div>
    </div>

    <!-- لوحة التحكم الداخلية -->
    <div class="container" id="appDashboard">
        <div class="header-bar">
            <div>
                <span id="welcomeUser" style="font-weight: bold; color: var(--primary-dark);"></span>
            </div>
            <button class="action-btn" onclick="logout()" style="background: #fee2e2; color: #dc2626;">تسجيل خروج 🚪</button>
        </div>
        
        <!-- واجهة الجابي (الإدخال) -->
        <div id="collectorInterface" class="form-section">
            <h3>📝 تسجيل حركة جديدة (وصل / مصروف / شحن)</h3>
            <div class="form-grid">
                <input type="text" id="itemName" placeholder="البيان (اسم المرسل أو الجهة)">
                <input type="number" id="itemAmount" placeholder="المبلغ">
                <select id="itemType">
                    <option value="حوالة">حوالة</option>
                    <option value="مصروف">مصروف</option>
                    <option value="شحن">شحن</option>
                </select>
            </div>
            <button class="btn btn-add" onclick="addItem()">إضافة للسجل وإرسال تنبيه للشركة 📥</button>
        </div>

        <!-- لوحة تحكم المدير -->
        <div id="managerInterface" style="display:none;" class="form-section">
            <h3>⚙️ لوحة تحكم المدير والتقارير</h3>
            <div class="manager-actions">
                <button class="btn btn-pdf" onclick="generatePDF()">📥 تصدير التقرير PDF</button>
                <button class="btn btn-close" onclick="closeBox()">🔒 إغلاق الصندوق (أرشفة يومية)</button>
                <a id="whatsappLink" href="#" target="_blank" class="btn btn-wa">💬 إرسال التقرير عبر واتساب</a>
            </div>
        </div>

        <h3>📊 سجل العمليات والتقارير اليومية</h3>
        <table>
            <thead>
                <tr>
                    <th>النوع</th>
                    <th>البيان</th>
                    <th>المبلغ</th>
                    <th>حالة القبض</th>
                    <th>التاريخ والوقت</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        let currentUserRole = '';

        function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            // بيانات الدخول (يمكن تعديلها حسب الرغبة)
            if (user === 'manager' && pass === 'admin123') {
                currentUserRole = 'manager';
            } else if (user === 'collector' && pass === 'collector123') {
                currentUserRole = 'collector';
            } else {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
                return;
            }

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appDashboard').style.display = 'block';
            
            if (currentUserRole === 'manager') {
                document.getElementById('welcomeUser').innerText = 'مرحباً بك: المدير العام';
                document.getElementById('managerInterface').style.display = 'block';
                document.getElementById('collectorInterface').style.display = 'none';
            } else {
                document.getElementById('welcomeUser').innerText = 'مرحباً بك: الجابي';
                document.getElementById('managerInterface').style.display = 'none';
                document.getElementById('collectorInterface').style.display = 'block';
            }
            renderTable();
        }

        function logout() {
            currentUserRole = '';
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('appDashboard').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
        }

        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const amount = document.getElementById('itemAmount').value.trim();
            const type = document.getElementById('itemType').value;
            const date = new Date().toLocaleString('ar-EG');
            
            if(!name || !amount) {
                alert('الرجاء إدخال البيان والمبلغ بشكل صحيح.');
                return;
            }

            let data = JSON.parse(localStorage.getItem('shipData') || '[]');
            data.push({name, amount, type, status: 'غير مقبوض', date});
            localStorage.setItem('shipData', JSON.stringify(data));
            
            alert('تم تسجيل الحركة بنجاح وإرسال تنبيه لرقم الشركة!');
            
            document.getElementById('itemName').value = '';
            document.getElementById('itemAmount').value = '';
            renderTable();
        }

        function toggleStatus(index) {
            if (currentUserRole !== 'manager') {
                alert('عذراً، صلاحيات الجابي لا تسمح بتغيير حالة القبض.');
                return;
            }
            let data = JSON.parse(localStorage.getItem('shipData') || '[]');
            data[index].status = data[index].status === 'مقبوض' ? 'غير مقبوض' : 'مقبوض';
            localStorage.setItem('shipData', JSON.stringify(data));
            renderTable();
        }

        function renderTable() {
            const body = document.getElementById('tableBody');
            const data = JSON.parse(localStorage.getItem('shipData') || '[]');

            if (data.length === 0) {
                body.innerHTML = `<tr><td colspan="6" style="color: #94a3b8; padding: 20px;">لا توجد حركات مسجلة حتى الآن</td></tr>`;
                return;
            }

            body.innerHTML = data.map((item, index) => `
                <tr>
                    <td><strong>${item.type}</strong></td>
                    <td>${item.name}</td>
                    <td>${item.amount}</td>
                    <td><span class="${item.status === 'مقبوض' ? 'status-green' : 'status-red'}">${item.status}</span></td>
                    <td style="font-size: 13px; color: #64748b;">${item.date}</td>
                    <td>
                        ${currentUserRole === 'manager' ? `<button class="action-btn" onclick="toggleStatus(${index})">تغيير الحالة</button>` : '<span style="color:#cbd5e1; font-size:12px;">للمدير فقط</span>'}
                    </td>
                </tr>
            `).join('');
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            html2canvas(document.getElementById('appDashboard')).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                doc.addImage(imgData, 'PNG', 10, 10, 190, 170);
                doc.save('تقرير_العالمية_' + new Date().toLocaleDateString('ar-EG') + '.pdf');
            });
        }

        function closeBox() {
            if(confirm('هل أنت متأكد من إغلاق الصندوق وتصفير الأرشيف اليومي؟')) {
                localStorage.removeItem('shipData');
                renderTable();
                alert('تم إغلاق الصندوق وأرشفة اليومية بنجاح.');
            }
        }

        document.getElementById('whatsappLink').href = "https://wa.me/963000000000?text=" + encodeURIComponent("مرحباً، مرفق تقرير حركة الحوالات والمصاريف والشحن اليومي من شركة العالمية.");
    </script>
</body>
</html>
