<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة العالمية - نظام الإدارة</title>
    <!-- استدعاء Firebase و FontAwesome -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; margin: 0; padding: 10px; direction: rtl; }
        .container { max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        /* الجدول الثابت */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th { background: #e2e8f0; padding: 8px; font-size: 12px; border: 1px solid #cbd5e1; text-align: center; }
        td { padding: 8px; font-size: 12px; border: 1px solid #cbd5e1; text-align: center; }
        
        /* إظهار العناصر */
        .show-block { display: block !important; }
    </style>
</head>
<body>
    <div class="container">
        <div id="mainApp" class="card">
            <h3 style="text-align:center;">لوحة الإدارة</h3>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>الوصل</th>
                        <th>الجابي</th>
                        <th>المبلغ ($)</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- البيانات ستظهر هنا -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // هذا الكود يضمن ظهور الجدول حتى لو كان فارغاً
        function renderUI(records) {
            let tbody = document.getElementById("tableBody");
            if(!tbody) return;
            tbody.innerHTML = "";
            
            if(records.length === 0) {
                tbody.innerHTML = "<tr><td colspan='4'>لا يوجد بيانات لعرضها</td></tr>";
                return;
            }

            records.forEach(r => {
                let discountDisplay = parseFloat(r.discount) > 0 ? `<br><small style="color:red;">حسم: $${r.discount}</small>` : '';
                tbody.innerHTML += `
                    <tr>
                        <td>${r.code || '---'}</td>
                        <td>${r.collector || '---'}</td>
                        <td>$${r.amount}${discountDisplay}</td>
                        <td><button onclick="alert('جارٍ التنفيذ...')">عرض</button></td>
                    </tr>`;
            });
        }
        
        // تجربة وهمية للتأكد أن الجدول يظهر
        renderUI([{code: 'A-001', collector: 'جابي 1', amount: '50.00', discount: '5.00'}]);
    </script>
</body>
</html>
