<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة العالمية - نظام الشحن والحوالات</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; direction: rtl; }
        .card { max-width: 850px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .login-card { max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #b8860b; text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #b8860b; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        button:hover { background: #996f08; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #f8f9fa; color: #333; }
        .green { color: green; font-weight: bold; }
        .red { color: red; font-weight: bold; }
        .btn-logout { background: #dc3545; width: auto; padding: 5px 15px; float: left; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginDiv" class="login-card">
        <h2>شركة العالمية</h2>
        <p style="color: #666; font-size: 13px;">نظام إدارة الشحن والحوالات</p>
        <input type="text" id="username" placeholder="اسم المستخدم (manager أو collector)">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
        <p style="font-size: 11px; color: #888; margin-top: 15px;">مدير: manager / admin123<br>جابي: collector / collector123</p>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="appDiv" class="card" style="display:none;">
        <button class="btn-logout" onclick="logout()">خروج</button>
        <h2>شركة العالمية - لوحة التحكم</h2>
        <p id="userRoleText" style="text-align:center; font-weight:bold; color:#555;"></p>

        <!-- قسم الإدخال (للجابي) -->
        <div id="collectorSection" style="background: #fdfcf7; padding: 15px; border-radius: 8px; border: 1px solid #faebd7; margin-bottom: 20px;">
            <h3 style="margin-top:0; color:#333; font-size:16px;">إضافة حركة جديدة (وصل / مصروف / شحن)</h3>
            <input type="text" id="clientName" placeholder="البيان (اسم المرسل أو الجهة)">
            <input type="number" id="amount" placeholder="المبلغ">
            <select id="type">
                <option value="حوالة">حوالة</option>
                <option value="مصروف">مصروف</option>
                <option value="شحن">شحن</option>
            </select>
            <button onclick="addData()">حفظ الحركة وإرسال تنبيه للشركة</button>
        </div>

        <!-- أزرار المدير -->
        <div id="managerSection" style="display:none; margin-bottom: 20px; text-align: center;">
            <button onclick="exportPDF()" style="background: #007bff; width: auto; margin-left: 5px;">تصدير تقرير PDF</button>
            <button onclick="closeBox()" style="background: #28a745; width: auto; margin-left: 5px;">إغلاق الصندوق (أرشفة يومية)</button>
            <a id="waBtn" href="#" target="_blank" style="display:inline-block; background:#25d366; color:white; padding:10px 15px; border-radius:6px; text-decoration:none; font-weight:bold; font-size:14px;">إرسال للواتساب</a>
        </div>

        <h3>التقارير اليومية</h3>
        <table>
            <thead>
                <tr>
                    <th>النوع</th>
                    <th>البيان</th>
                    <th>المبلغ</th>
                    <th>الحالة</th>
                    <th>التاريخ والوقت</th>
                    <th>إجراء المدير</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        let currentRole = "";

        function login() {
            let u = document.getElementById("username").value.trim();
            let p = document.getElementById("password").value.trim();

            if (u === "manager" && p === "admin123") {
                currentRole = "manager";
            } else if (u === "collector" && p === "collector123") {
                currentRole = "collector";
            } else {
                alert("خطأ في اسم المستخدم أو كلمة المرور!");
                return;
            }

            document.getElementById("loginDiv").style.display = "none";
            document.getElementById("appDiv").style.display = "block";

            if (currentRole === "manager") {
                document.getElementById("userRoleText").innerText = "الصلاحية: المدير العام";
                document.getElementById("managerSection").style.display = "block";
                document.getElementById("collectorSection").style.display = "none";
            } else {
                document.getElementById("userRoleText").innerText = "الصلاحية: جابي";
                document.getElementById("managerSection").style.display = "none";
                document.getElementById("collectorSection").style.display = "block";
            }
            loadTable();
        }

        function logout() {
            currentRole = "";
            document.getElementById("appDiv").style.display = "none";
            document.getElementById("loginDiv").style.display = "block";
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }

        function addData() {
            let name = document.getElementById("clientName").value.trim();
            let amount = document.getElementById("amount").value.trim();
            let type = document.getElementById("type").value;
            let date = new Date().toLocaleString();

            if (!name || !amount) {
                alert("الرجاء ملء كافة الحقول!");
                return;
            }

            let records = JSON.parse(localStorage.getItem("shippData") || "[]");
            records.push({ name, amount, type, status: "غير مقبوض", date });
            localStorage.setItem("shippData", JSON.stringify(records));

            alert("تمت الإضافة بنجاح وإرسال تنبيه لرقم الشركة!");
            document.getElementById("clientName").value = "";
            document.getElementById("amount").value = "";
            loadTable();
        }

        function toggleStatus(index) {
            if (currentRole !== "manager") return;
            let records = JSON.parse(localStorage.getItem("shippData") || "[]");
            records[index].status = records[index].status === "مقبوض" ? "غير مقبوض" : "مقبوض";
            localStorage.setItem("shippData", JSON.stringify(records));
            loadTable();
        }

        function loadTable() {
            let records = JSON.parse(localStorage.getItem("shippData") || "[]");
            let tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="color:#777;">لا توجد بيانات مسجلة حالياً</td></tr>`;
                return;
            }

            records.forEach((item, index) => {
                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${item.type}</td>
                    <td>${item.name}</td>
                    <td>${item.amount}</td>
                    <td><span class="${item.status === 'مقبوض' ? 'green' : 'red'}">${item.status}</span></td>
                    <td>${item.date}</td>
                    <td>
                        ${currentRole === 'manager' ? `<button onclick="toggleStatus(${index})" style="padding:4px 8px; font-size:12px; width:auto;">تبديل الحالة</button>` : 'للمدير فقط'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            html2canvas(document.getElementById("appDiv")).then(canvas => {
                let img = canvas.toDataURL("image/png");
                doc.addImage(img, "PNG", 10, 10, 190, 0);
                doc.save("تقرير_العالمية.pdf");
            });
        }

        function closeBox() {
            if (confirm("هل أنت متأكد من إغلاق الصندوق وأرشفة وتصفير اليومية؟")) {
                localStorage.removeItem("shippData");
                loadTable();
                alert("تم إغلاق الصندوق بنجاح.");
            }
        }

        document.getElementById("waBtn").href = "https://wa.me/963000000000?text=" + encodeURIComponent("مرحباً، هذا هو تقرير شركة العالمية للحوالات والمصاريف والشحن اليومي.");
    </script>
</body>
</html>
