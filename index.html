<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة العالمية - نظام إدارة الشحن والحوالات</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-dark: #aa820a; --dark: #1e293b; --light: #f8fafc; --success: #10b981; --danger: #ef4444; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light); margin: 0; padding: 20px; direction: rtl; color: var(--dark); }
        .card { max-width: 950px; margin: auto; background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .login-card { max-width: 420px; margin: 50px auto; background: white; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 5px solid var(--gold); }
        .logo-img { width: 120px; height: auto; margin-bottom: 15px; filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.15)); }
        .form-group { margin-bottom: 18px; text-align: right; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #475569; }
        input, select { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; font-size: 14px; }
        .btn { background: linear-gradient(135deg, #d4af37, #aa820a); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        .btn-logout { background: #fee2e2; color: #dc2626; width: auto; padding: 8px 16px; float: left; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .login-opt-btn { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; flex: 1; }
        .login-opt-btn.active { background: var(--gold); color: white; border-color: var(--gold); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 10px; overflow: hidden; }
        th, td { border: 1px solid #f1f5f9; padding: 14px; text-align: center; font-size: 14px; }
        th { background: #f8fafc; color: #475569; }
        .badge-red { color: var(--danger); background: #fef2f2; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginDiv" class="login-card">
        <img src="image_2.png" class="logo-img" onerror="this.style.display='none'">
        <h2>شركة العالمية</h2>
        <p style="color: #64748b; font-size: 13px; margin-bottom: 20px;">نظام إدارة الشحن والحوالات</p>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="login-opt-btn active" id="btnM" onclick="setRole('manager')">⚙️ مدير العالمية</button>
            <button class="login-opt-btn" id="btnC" onclick="setRole('collector')">💵 جابي 1</button>
        </div>
        <div class="form-group">
            <input type="password" id="pass" placeholder="كلمة المرور..." onkeydown="if(event.key==='Enter') login()">
        </div>
        <button class="btn" onclick="login()">🔓 دخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="appDiv" class="card" style="display:none;">
        <button class="btn-logout" onclick="location.reload()">🚪 خروج</button>
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px;">
            <img src="image_2.png" style="width: 50px; height: auto;" onerror="this.style.display='none'">
            <div>
                <h2 style="margin:0; color: var(--gold-dark);">شركة العالمية</h2>
                <span id="roleTitle" style="font-size: 13px; color: #64748b; font-weight: 600;"></span>
            </div>
        </div>

        <!-- قسم الإدخال (خاص بالجابي 1) -->
        <div id="collectorSection" style="display:none; background: #fafaf9; padding: 20px; border-radius: 14px; margin-bottom: 25px; border: 1px solid #e2e8f0;">
            <h3 style="margin-top:0; font-size:16px; color: var(--gold-dark);">📥 تسجيل حركة جديدة</h3>
            <div class="form-group">
                <label>نوع الحركة:</label>
                <select id="type">
                    <option value="حوالة">حوالة مالية</option>
                    <option value="شحن">إيراد شحن</option>
                    <option value="مصروف">مصروف (دفعة نقدية)</option>
                </select>
            </div>
            <div class="form-group">
                <label>اسم الزبون / سبب المصروف:</label>
                <input type="text" id="clientName" placeholder="أدخل التفاصيل هنا...">
            </div>
            <div class="form-group">
                <label>المبلغ:</label>
                <input type="number" id="amount" placeholder="المبلغ بالأرقام...">
            </div>
            <button class="btn" onclick="addData()">✅ حفظ وإصدار السند</button>
        </div>

        <!-- قسم الإعدادات وأزرار التحكم (خاص بمدير العالمية حصراً) -->
        <div id="managerSection" style="display:none; background: #fdf8ed; padding: 20px; border-radius: 14px; margin-bottom: 25px; border: 1px solid #fef3c7;">
            <h3 style="margin-top:0; font-size:16px; color: #92400e;">⚙️ إعدادات مدير العالمية والربط</h3>
            <div class="form-group" style="max-width: 400px;">
                <label>رقم واتساب الشركة الأساسي (لاستلام التقارير):</label>
                <input type="text" id="companyWaInput" placeholder="مثال: 963912345678">
            </div>
            <button class="btn" onclick="saveSettings()" style="width: auto; background: #b45309; margin-bottom: 15px;">💾 حفظ رقم الشركة</button>
            <div style="text-align: center; border-top: 1px solid #fde68a; padding-top: 15px;">
                <button class="btn" onclick="finalClose()" style="background:#16a34a; width:auto;">🔒 إغلاق الصندوق والأرشفة الفورية عبر واتساب</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>النوع</th>
                    <th>البيان / السبب</th>
                    <th>المبلغ</th>
                    <th>الحالة</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        let role = "";
        function setRole(r) {
            role = r;
            document.getElementById('btnM').className = (r==='manager' ? 'login-opt-btn active' : 'login-opt-btn');
            document.getElementById('btnC').className = (r==='collector' ? 'login-opt-btn active' : 'login-opt-btn');
        }

        function login() {
            let p = document.getElementById("pass").value;
            if((role==='manager' && p==='admin123') || (role==='collector' && p==='collector123')) {
                document.getElementById("loginDiv").style.display = "none";
                document.getElementById("appDiv").style.display = "block";
                
                if(role === 'manager') {
                    document.getElementById("roleTitle").innerText = "مدير العالمية";
                    document.getElementById("managerSection").style.display = "block";
                    document.getElementById("collectorSection").style.display = "none";
                    let savedWa = localStorage.getItem("companyWa") || "963000000000";
                    document.getElementById("companyWaInput").value = savedWa;
                } else {
                    document.getElementById("roleTitle").innerText = "جابي 1";
                    document.getElementById("managerSection").style.display = "none";
                    document.getElementById("collectorSection").style.display = "block";
                }
                loadTable();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function saveSettings() {
            let waNum = document.getElementById("companyWaInput").value.trim();
            if(!waNum) {
                alert("الرجاء إدخال رقم صحيح!");
                return;
            }
            localStorage.setItem("companyWa", waNum);
            alert("✅ تم حفظ رقم واتساب الشركة بنجاح!");
        }

        function addData() {
            let name = document.getElementById("clientName").value.trim();
            let amount = document.getElementById("amount").value.trim();
            if(!name || !amount) {
                alert("الرجاء ملء كافة الحقول!");
                return;
            }
            let records = JSON.parse(localStorage.getItem("shippData") || "[]");
            records.push({ type: document.getElementById("type").value, name: name, amount: amount, status: "مقبوض", date: new Date().toLocaleString('ar-EG') });
            localStorage.setItem("shippData", JSON.stringify(records));
            document.getElementById("clientName").value = "";
            document.getElementById("amount").value = "";
            loadTable();
            alert("✅ تم تسجيل الحركة بنجاح!");
        }

        function cancelRecord(i) {
            let reason = prompt("يرجى إدخال سبب إلغاء هذا الوصل (إجباري):");
            if(reason && reason.trim() !== "") {
                let records = JSON.parse(localStorage.getItem("shippData") || "[]");
                records[i].status = "ملغي: " + reason;
                localStorage.setItem("shippData", JSON.stringify(records));
                loadTable();
            } else {
                alert("يجب إدخال سبب للإلغاء ولن يتم إلغاء الوصل دونه!");
            }
        }

        function loadTable() {
            let records = JSON.parse(localStorage.getItem("shippData") || "[]");
            let tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";
            if(records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="color:#94a3b8; padding: 20px;">لا توجد حركات مسجلة حالياً</td></tr>`;
                return;
            }
            records.forEach((r, i) => {
                let isCanceled = r.status.includes('ملغي');
                tbody.innerHTML += `
                    <tr>
                        <td><b>${r.type}</b></td>
                        <td>${r.name}</td>
                        <td>${r.amount}</td>
                        <td><span style="color: ${isCanceled ? 'red' : 'green'}; font-weight: bold;">${r.status}</span></td>
                        <td>
                            ${role==='collector' && !isCanceled ? `<button onclick="cancelRecord(${i})" class="badge-red" style="border:none; cursor:pointer;">إلغاء الوصل</button>` : '<span style="color:#cbd5e1; font-size:12px;">معتمد</span>'}
                        </td>
                    </tr>`;
            });
        }

        function finalClose() {
            if(confirm("هل أنت متأكد من إغلاق الصندوق؟ سيتم إرسال التقرير فوراً لواتساب الشركة وتصفير اليومية.")) {
                let companyWa = localStorage.getItem("companyWa") || "963000000000";
                let records = JSON.parse(localStorage.getItem("shippData") || "[]");
                
                let msg = "📊 تقرير شركة العالمية اليومي المغلق:%0A";
                let total = 0;
                records.forEach(r => {
                    msg += `- ${r.type}: ${r.amount} (${r.name}) [${r.status}]%0A`;
                    if(!r.status.includes('ملغي') && r.type !== 'مصروف') total += parseFloat(r.amount) || 0;
                });
                msg += `%0A💰 إجمالي الصندوق: ${total}`;
                
                window.open(`https://wa.me/${companyWa}?text=` + msg, '_blank');
                
                localStorage.removeItem("shippData");
                loadTable();
                alert("🔒 تم إغلاق الصندوق وأرشفة البيانات بنجاح.");
            }
        }
    </script>
</body>
</html>
