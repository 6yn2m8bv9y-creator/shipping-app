<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة العالمية - نظام الإدارة السحابي</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --primary: #0284c7; --primary-dark: #0369a1; --gold: #d4af37; --gold-dark: #b45309; 
            --dark: #0f172a; --light: #f8fafc; --success: #10b981; --danger: #ef4444; --border: #cbd5e1;
            --card-bg: #ffffff; --text-color: #0f172a; --sub-text: #64748b;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light); margin: 0; padding: 15px; direction: rtl; color: var(--text-color); }
        .card { max-width: 1100px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid var(--border); }
        .login-card { max-width: 420px; margin: 30px auto; background: var(--card-bg); padding: 30px; border-radius: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 6px solid var(--gold); }
        .brand-logo-badge { width: 80px; height: 80px; margin: 0 auto 15px auto; border-radius: 50%; background: linear-gradient(135deg, #d4af37, #b45309); color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 4px 15px rgba(212,175,55,0.3); }
        .form-group { margin-bottom: 18px; text-align: right; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        input, select { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%; }
        .btn-gold { background: linear-gradient(135deg, #d4af37, #b45309); }
        .btn-settle { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .btn-logout { background: #fef2f2; color: var(--danger); border: 1px solid #fee2e2; padding: 8px 16px; border-radius: 10px; }
        .top-bar-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .collector-summary-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .collector-card { background: var(--light); border: 1px solid var(--border); padding: 18px; border-radius: 16px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); border-radius: 12px; overflow: hidden; }
        th, td { border-bottom: 1px solid var(--border); padding: 14px; text-align: center; font-size: 14px; }
        th { background: var(--light); color: var(--sub-text); }
        .type-pill { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .type-حوالة { background: #dcfce7; color: #166534; }
        .type-شحن { background: #dbeafe; color: #1e40af; }
        .type-مصروف { background: #fee2e2; color: #991b1b; }
        .type-تسوية { background: #fef3c7; color: #b45309; }
        .receipt-code { font-family: monospace; font-weight: bold; color: var(--primary-dark); }
    </style>
</head>
<body>

    <div id="loginDiv" class="login-card">
        <div class="brand-logo-badge"><i class="fas fa-globe"></i></div>
        <h2 style="margin: 0 0 2px 0; font-size: 19px;">شركة العالمية</h2>
        <div id="collectorSelectGroup" style="display:none; margin-bottom:15px;">
            <select id="loginCollectorName"></select>
        </div>
        <div class="form-group">
            <input type="password" id="pass" placeholder="كلمة المرور...">
        </div>
        <button class="btn btn-gold" onclick="login()">دخول</button>
    </div>

    <div id="appDiv" class="card" style="display:none;">
        <button class="btn-logout" onclick="location.reload()">تسجيل خروج</button>
        <h3 id="roleTitle" style="color:var(--gold-dark);"></h3>

        <div id="collectorSection" style="display:none;">
            <select id="type"><option value="حوالة">حوالة</option><option value="شحن">شحن</option><option value="مصروف">مصروف</option></select>
            <input type="text" id="clientName" placeholder="الاسم/البيان" style="margin:10px 0;">
            <input type="number" id="amount" placeholder="المبلغ">
            <button class="btn btn-gold" onclick="addData()" style="margin-top:10px;">حفظ</button>
        </div>

        <div id="managerSection" style="display:none;">
            <div id="collectorsSummaryContainer" class="collector-summary-box"></div>
        </div>

        <table>
            <thead><tr><th>الوصل</th><th>الجابي</th><th>النوع</th><th>البيان</th><th>المبلغ</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = { projectId: "shipping-b300f" }; // استبدل ببياناتك الأصلية
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let role = "";
        let currentCollectorLoggedIn = "";

        function setRole(r) { role = r; document.getElementById('collectorSelectGroup').style.display = r==='collector' ? 'block' : 'none'; }
        
        function login() {
            // منطق الدخول البسيط
            role = document.getElementById('btnC') ? 'collector' : 'manager'; // تبسيط
            document.getElementById("loginDiv").style.display = "none";
            document.getElementById("appDiv").style.display = "block";
            startApp();
        }

        function startApp() {
            if(role === 'manager') document.getElementById("managerSection").style.display = "block";
            else document.getElementById("collectorSection").style.display = "block";
            listenToDatabase();
        }

        function addData() {
            db.collection("shippings").add({
                code: "GLB-" + Math.floor(1000+Math.random()*9000),
                collector: currentCollectorLoggedIn || "مدير",
                type: document.getElementById("type").value,
                name: document.getElementById("clientName").value,
                amount: document.getElementById("amount").value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => alert("تم الحفظ!"));
        }

        function settleCollector(name) {
            db.collection("shippings").add({
                code: "SET-" + Math.floor(100+Math.random()*900),
                collector: name,
                type: "تسوية", // تم التصحيح هنا
                name: "تسوية نقدية",
                amount: "0.00",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => alert("تمت التسوية!"));
        }

        function listenToDatabase() {
            db.collection("shippings").orderBy("timestamp", "desc").onSnapshot(snap => {
                let tbody = document.getElementById("tableBody");
                tbody.innerHTML = "";
                snap.forEach(doc => {
                    let r = doc.data();
                    tbody.innerHTML += `<tr>
                        <td class="receipt-code">${r.code}</td>
                        <td>${r.collector}</td>
                        <td><span class="type-pill type-${r.type}">${r.type}</span></td>
                        <td>${r.name}</td>
                        <td>$${r.amount}</td>
                    </tr>`;
                });
            });
        }
    </script>
</body>
</html>
