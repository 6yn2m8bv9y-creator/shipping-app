<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شركة العالمية | النظام المالي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --primary: #0284c7; --gold: #d4af37; --dark: #0f172a; --light: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 20px; }
        .card { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid var(--gold); }
        .logo { width: 100px; margin: auto; display: block; border-radius: 50%; }
        .btn { padding: 12px 20px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-gold { background: var(--gold); color: white; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f1f5f9; padding: 12px; border-bottom: 2px solid var(--primary); }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <img src="image_2.png" class="logo" onerror="this.style.display='none'">
        <h2 style="text-align: center; color: var(--dark);">شركة العالمية - كشف الحساب</h2>
        <div id="content">
            <!-- سيظهر هنا محتوى النظام -->
            <p style="text-align: center;">جاري تحسين الواجهة وتجهيز نظام الـ PDF الاحترافي...</p>
        </div>
        <button class="btn btn-gold" onclick="generateProfessionalPDF()">تحميل التقرير كـ PDF محترم</button>
    </div>

    <script>
        async function generateProfessionalPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // إضافة الشعار في الـ PDF
            doc.setFontSize(18);
            doc.text("تقرير شركة العالمية اليومي", 105, 20, { align: "center" });
            
            // جلب البيانات من الـ LocalStorage
            let records = JSON.parse(localStorage.getItem("shippData") || "[]");
            let tableData = records.map(r => [r.collector, r.type, r.name, r.amount, r.status]);
            
            doc.autoTable({
                head: [['الجابي', 'النوع', 'البيان', 'المبلغ', 'الحالة']],
                body: tableData,
                theme: 'striped',
                headStyles: { fillColor: [212, 175, 55] } // لون ذهبي للجدول
            });
            
            doc.save("تقرير_العالمية_المالي.pdf");
            alert("تم إنشاء ملف الـ PDF الاحترافي بنجاح!");
        }
    </script>
</body>
</html>
