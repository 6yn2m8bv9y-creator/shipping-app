<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شركة العالمية - نظام PDF</title>
    <!-- إضافة مكتبة jspdf لعمل ملفات PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- باقي الروابط والستايلات -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- ... [هنا ضع نفس الستايلات CSS اللي بالرد السابق للحفاظ على التصميم] ... -->
    <style>
        /* ... نفس الستايلات السابقة ... */
        .pdf-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body data-theme="dark">

    <!-- سنضيف فقط وظيفة PDF الجديدة في قسم السكربت -->
    <script>
        // دالة إنشاء الـ PDF الاحترافي
        async function generateSettlementPDF(collectorName, expectedAmount, actualAmount, diffText) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            
            // تصميم احترافي للـ PDF
            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.text("شركة العالمية للشحن والحوالات", 105, 20, { align: "center" });
            
            doc.setFontSize(14);
            doc.text("سند تسوية صندوق ومطابقة مالية", 105, 35, { align: "center" });
            
            doc.setFontSize(12);
            doc.text(`التاريخ: ${new Date().toLocaleDateString('ar-EG')}`, 190, 50, { align: "right" });
            doc.text(`الجابي: ${collectorName}`, 190, 60, { align: "right" });
            
            // جدول البيانات (مبسط)
            doc.line(10, 70, 200, 70);
            doc.text(`المبلغ المتوقع: $${expectedAmount.toFixed(2)}`, 190, 85, { align: "right" });
            doc.text(`المبلغ الفعلي: $${actualAmount.toFixed(2)}`, 190, 95, { align: "right" });
            doc.text(`النتيجة: ${diffText}`, 190, 105, { align: "right" });
            doc.line(10, 120, 200, 120);
            
            doc.text("توقيع المدير: الحاج بلال عبد الرزاق", 190, 140, { align: "right" });
            doc.text("توقيع الجابي: ..........................", 50, 140, { align: "left" });

            // خيارات التحميل والمشاركة
            const pdfData = doc.output('blob');
            const fileName = `Settlement_${collectorName}_${Date.now()}.pdf`;
            
            // تحميل للطباعة
            const link = document.createElement('a');
            link.href = URL.createObjectURL(pdfData);
            link.download = fileName;
            link.click();
            
            alert("تم إنشاء ملف الـ PDF بنجاح، يمكنك الآن طباعته أو إرساله كوثيقة عبر واتساب!");
        }

        // في دالة الـ settleCollector، استبدل جزء إرسال الواتساب بـ:
        // generateSettlementPDF(collectorName, expectedAmount, actualAmount, diffText);
    </script>
</body>
</html>
