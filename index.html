<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة العالمية - نظام إدارة الشحن والحوالات</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --primary: #0284c7; 
            --primary-dark: #0369a1; 
            --gold: #d4af37; 
            --gold-dark: #b45309; 
            --dark: #0f172a; 
            --light: #f0f9ff; 
            --success: #10b981; 
            --danger: #ef4444; 
            --border: #bae6fd;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light); margin: 0; padding: 20px; direction: rtl; color: var(--dark); }
        .card { max-width: 1000px; margin: auto; background: white; padding: 35px; border-radius: 24px; box-shadow: 0 10px 30px rgba(2, 132, 199, 0.08); border: 1px solid var(--border); }
        
        .login-card { max-width: 420px; margin: 50px auto; background: white; padding: 40px; border-radius: 24px; text-align: center; box-shadow: 0 10px 30px rgba(2, 132, 199, 0.08); border-top: 6px solid var(--primary); }
        .logo-img { width: 130px; height: auto; margin-bottom: 15px; filter: drop-shadow(0px 6px 12px rgba(0,0,0,0.12)); }
        
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: #334155; }
        input, select { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 12px; box-sizing: border-box; font-size: 14px; background: #fff; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }
        .btn:hover { background: var(--primary-dark); }
        .btn-gold { background: linear-gradient(135deg, #d4af37, #b45309); box-shadow: 0 4px 12px rgba(212,175,55,0.25); }
        .btn-logout { background: #fef2f2; color: var(--danger); width: auto; padding: 8px 16px; float: left; border-radius: 10px; border: 1px solid #fee2e2; cursor: pointer; font-weight: 600; font-size: 13px; }
        
        .login-options { display: flex; gap: 10px; margin-bottom: 20px; }
        .login-opt-btn { background: #f8fafc; color: #475569; border: 1px solid #cbd5e1; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; flex: 1; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .login-opt-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }

        .collector-summary-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .collector-card { background: #f8fafc; border: 1px solid var(--border); padding: 18px; border-radius: 16px; text-align: center; }
        .collector-card h4 { margin: 0 0 8px 0; color: var(--primary-dark); font-size: 15px; }
        .collector-card p { margin: 0; font-size: 20px; font-weight: bold; color: var(--dark); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 14px; text-align: center; font-size: 14px; }
        th { background: #f8fafc; color: #475569; font-weight: 600; }
        
        .badge-red { color: var(--danger); background: #fef2f2; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; border: 1px solid #fee2e2; cursor: pointer; }
        .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; border-bottom: 2px solid #f0f9ff; padding-bottom: 20px; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginDiv" class="login-card">
        <img src="image_2.png" class="logo-img" onerror="this.style.display='none'">
        <h2 style="margin: 5px 0 5px 0; font-size: 22px; color: var(--primary-dark);">شركة العالمية</h2>
        <p style="color: #64748b; font-size: 13px; margin-bottom: 25px;">نظام إدارة الشحن والحوالات والقبض</p>
        
        <div class="login-options">
            <button type="button" class="login-opt-btn active" id="btnM" onclick="setRole('manager')">مدير العالمية</button>
            <button type="button" class="login-opt-btn" id="btnC" onclick="setRole('collector')">جابي</button>
        </div>
        
        <div class="form-group" id="collectorSelectGroup" style="display:none;">
            <label>اختر اسم الجابي:</label>
            <select id="loginCollectorName"></select>
        </div>

        <div class="form-group">
            <input type="password" id="pass" placeholder="كلمة المرور..." onkeydown="if(event.key==='Enter') login()">
        </div>
        <button class="btn btn-gold" onclick="login()">تسجيل الدخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="appDiv" class="card" style="display:none;">
        <button class="btn-logout" onclick="location.reload()">تسجيل خروج</button>
        <div class="app-header">
            <div style="display: flex; align-items: center; gap: 14px;">
                <img src="image_2.png" style="width: 50px; height: auto;" onerror="this.style.display='none'">
                <div>
                    <h2 style="margin:0; font-size: 20px; color: var(--primary-dark);">شركة العالمية</h2>
                    <span id="roleTitle" style="font-size: 13px; color: #64748b; font-weight: 600;"></span>
                </div>
            </div>
        </div>

        <!-- قسم الإدخال (خاص بالجابي) -->
        <div id="collectorSection" style="display:none; background: #f8fafc; padding: 22px; border-radius: 16px; margin-bottom: 25px; border: 1px solid var(--border);">
            <h3 style="margin-top:0; font-size:16px; color: var(--primary-dark);">تسجيل حركة جديدة في الصندوق</h3>
            <div class="form-group">
                <label>نوع الحركة:</label>
                <select id="type">
                    <option value="حوالة">حوالة مالية</option>
                    <option value="شحن">إيراد شحن</option>
                    <option value="مصروف">مصروف (دفعة نقدية)</option>
                </select>
            </div>
            <div class="form-group">
                <label>اسم الزبون / سبب المصروف:</label>
                <input type="text" id="clientName" placeholder="أدخل التفاصيل هنا...">
            </div>
            <div class="form-group">
                <label>المبلغ:</label>
                <input type="number" id="amount" placeholder="المبلغ بالأرقام...">
            </div>
            <button class="btn" onclick="addData()">حفظ وإصدار السند</button>
        </div>

        <!-- قسم الإعدادات والكشوفات (خاص بمدير العالمية) -->
        <div id="managerSection" style="display:none; background: #f0f9ff; padding: 22px; border-radius: 16px; margin-bottom: 25px; border: 1px solid var(--border);">
            <h3 style="margin-top:0; font-size:16px; color: var(--primary-dark);">كشوفات المبالغ مع الجباة</h3>
            <div id="collectorsSummaryContainer" class="collector-summary-box"></div>

            <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0;">

            <h3 style="margin-top:0; font-size:16px; color: var(--primary-dark);">إعدادات النظام وإدارة الجباة</h3>
            <div class="form-group" style="max-width: 400px;">
                <label>رقم واتساب الشركة الأساسي:</label>
                <input type="text" id="companyWaInput" placeholder="مثال: 963912345678">
            </div>
            <button class="btn" onclick="saveSettings()" style="width: auto; margin-bottom: 20px;">حفظ رقم الشركة</button>

            <div style="display: flex; gap: 10px; max-width: 600px; margin-bottom: 15px;">
                <input type="text" id="newCollectorName" placeholder="اسم الجابي الجديد (مثال: جابي 2)">
                <input type="password" id="newCollectorPass" placeholder="كلمة المرور">
                <button class="btn btn-gold" onclick="addNewCollector()" style="width: auto;">إضافة جابي</button>
            </div>
            <p id="collectorsListText" style="font-size: 13px; color: #64748b; margin-bottom: 20px;"></p>

            <div style="border-top: 1px solid var(--border); padding-top: 15px; text-align: center;">
                <button class="btn" onclick="finalClose()" style="background:var(--success); width:auto;">إغلاق الصندوق وأرشفة وإرسال التقرير عبر واتساب</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>الجابي / المسؤول</th>
                    <th>النوع</th>
                    <th>البيان / السبب</th>
                    <th>المبلغ</th>
                    <th>الحالة</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        let role = "";
        let currentCollectorLoggedIn = "";

        if (!localStorage.getItem("collectorsData")) {
            let defaultCollectors = [{ name: "جابي 1", pass: "collector123" }, { name: "جابي 2", pass: "collector123" }];
            localStorage.setItem("collectorsData", JSON.stringify(defaultCollectors));
        }

        function setRole(r) {
            role = r;
            if(r === 'manager') {
                document.getElementById('btnM').className = 'login-opt-btn active';
                document.getElementById('btnC').className = 'login-opt-btn';
                document.getElementById('collectorSelectGroup').style.display = 'none';
            } else {
                document.getElementById('btnC').className = 'login-opt-btn active';
                document.getElementById('btnM').className = 'login-opt-btn';
                document.getElementById('collectorSelectGroup').style.display = 'block';
                populateCollectorDropdown();
            }
        }

        function populateCollectorDropdown() {
            let collectors = JSON.parse(localStorage.getItem("collectorsData") || "[]");
            let select = document.getElementById('loginCollectorName');
            select.innerHTML = "";
            collectors.forEach(c => {
                let opt = document.createElement('option');
                opt.value = c.name;
                opt.innerText = c.name;
                select.appendChild(opt);
            });
        }
        populateCollectorDropdown();

        function addNewCollector() {
            let name = document.getElementById('newCollectorName').value.trim();
            let pass = document.getElementById('newCollectorPass').value.trim();
            if(!name || !pass) { alert("الرجاء إدخال اسم الجابي وكلمة المرور!"); return; }
            let collectors = JSON.parse(localStorage.getItem("collectorsData") || "[]");
            if(collectors.some(c => c.name === name)) { alert("هذا الجابي موجود مسبقاً!"); return; }
            collectors.push({ name, pass });
            localStorage.setItem("collectorsData", JSON.stringify(collectors));
            document.getElementById('newCollectorName').value = "";
            document.getElementById('newCollectorPass').value = "";
            updateCollectorsListUI();
            populateCollectorDropdown();
            alert("تم إضافة الجابي بنجاح!");
        }

        function updateCollectorsListUI() {
            let collectors = JSON.parse(localStorage.getItem("collectorsData") || "[]");
            let listText = collectors.map(c => c.name).join(" ، ");
            document.getElementById('collectorsListText').innerText = "الجباة المسجلين: " + listText;
        }

        function login() {
            let p = document.getElementById("pass").value;
            if (role === 'manager') {
                if (p === "admin123") {
                    currentCollectorLoggedIn = "مدير العالمية";
                    startApp("مدير العالمية");
                } else { alert("كلمة مرور المدير غير صحيحة!"); }
            } else {
                let selectedName = document.getElementById('loginCollectorName').value;
                let collectors = JSON.parse(localStorage.getItem("collectorsData") || "[]");
                let found = collectors.find(c => c.name === selectedName && c.pass === p);
                if (found) {
                    currentCollectorLoggedIn = found.name;
                    startApp(found.name);
                } else { alert("كلمة المرور غير صحيحة لهذا الجابي!"); }
            }
        }

        function startApp(titleName) {
            document.getElementById("loginDiv").style.display = "none";
            document.getElementById("appDiv").style.display = "block";
            document.getElementById("roleTitle").innerText = titleName;

            if(role === 'manager') {
                document.getElementById("managerSection").style.display = "block";
                document.getElementById("collectorSection").style.display = "none";
                document.getElementById("companyWaInput").value = localStorage.getItem("companyWa") || "963000000000";
                updateCollectorsListUI();
                renderManagerSummary();
            } else {
                document.getElementById("managerSection").style.display = "none";
                document.getElementById("collectorSection").style.display = "block";
            }
            loadTable();
        }

        function saveSettings() {
            let waNum = document.getElementById("companyWaInput").value.trim();
            if(!waNum) { alert("الرجاء إدخال رقم صحيح!"); return; }
            localStorage.setItem("companyWa", waNum);
            alert("تم حفظ رقم واتساب الشركة بنجاح!");
        }

        function addData() {
            let name = document.getElementById("clientName").value.trim();
            let amount = document.getElementById("amount").value.trim();
            if(!name || !amount) { alert("الرجاء ملء كافة الحقول!"); return; }
            
            let records = JSON.parse(localStorage.getItem("shippData") || "[]");
            records.push({ 
                collector: currentCollectorLoggedIn, 
                type: document.getElementById("type").value, 
                name: name, 
                amount: amount, 
                status: "مقبوض", 
                date: new Date().toLocaleString('ar-EG') 
            });
            localStorage.setItem("shippData", JSON.stringify(records));
            document.getElementById("clientName").value = "";
            document.getElementById("amount").value = "";
            loadTable();
            alert("تم تسجيل الحركة بنجاح!");
        }

        function cancelRecord(i) {
            let reason = prompt("يرجى إدخال سبب إلغاء هذا الوصل (إجباري):");
            if(reason && reason.trim() !== "") {
                let records = JSON.parse(localStorage.getItem("shippData") || "[]");
                records[i].status = "ملغي: " + reason;
                localStorage.setItem("shippData", JSON.stringify(records));
                loadTable();
                if(role === 'manager') renderManagerSummary();
            } else { alert("يجب إدخال سبب للإلغاء ولن يتم إلغاء الوصل دونه!"); }
        }

        function renderManagerSummary() {
            let records = JSON.parse(localStorage.getItem("shippData") || "[]");
            let collectors = JSON.parse(localStorage.getItem("collectorsData") || "[]");
            let container = document.getElementById("collectorsSummaryContainer");
            container.innerHTML = "";

            let summaryData = {};
            collectors.forEach(c => summaryData[c.name] = 0);

            records.forEach(r => {
                let col = r.collector || "جابي 1";
                if(!r.status.includes('ملغي')) {
                    let amt = parseFloat(r.amount) || 0;
                    if(summaryData[col] !== undefined) {
                        if(r.type === 'مصروف') summaryData[col] -= amt;
                        else summaryData[col] += amt;
                    }
                }
            });

            for(let colName in summaryData) {
                container.innerHTML += `
                    <div class="collector-card">
                        <h4>المبلغ بحوزة: ${colName}</h4>
                        <p>${summaryData[colName]} ليرة</p>
                    </div>`;
            }
        }

        function loadTable() {
            let records = JSON.parse(localStorage.getItem("shippData") || "[]");
            let tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";
            if(records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="color:#94a3b8; padding: 20px;">لا توجد حركات مسجلة حالياً</td></tr>`;
                return;
            }
            records.forEach((r, i) => {
                let isCanceled = r.status.includes('ملغي');
                let rowCollector = r.collector || "جابي 1";
                tbody.innerHTML += `
                    <tr>
                        <td><b>${rowCollector}</b></td>
                        <td><b>${r.type}</b></td>
                        <td>${r.name}</td>
                        <td>${r.amount}</td>
                        <td><span style="color: ${isCanceled ? 'var(--danger)' : 'var(--success)'}; font-weight: bold;">${r.status}</span></td>
                        <td>
                            ${role==='collector' && !isCanceled && r.collector === currentCollectorLoggedIn ? `<button onclick="cancelRecord(${i})" class="badge-red">إلغاء الوصل</button>` : '<span style="color:#cbd5e1; font-size:12px;">معتمد</span>'}
                        </td>
                    </tr>`;
            });
            if(role === 'manager') renderManagerSummary();
        }

        function finalClose() {
            if(confirm("هل أنت متأكد من إغلاق الصندوق؟ سيتم إرسال التقرير المفصل لكل جابي لواتساب الشركة وتصفير اليومية.")) {
                let companyWa = localStorage.getItem("companyWa") || "963000000000";
                let records = JSON.parse(localStorage.getItem("shippData") || "[]");
                
                let msg = "📊 تقرير شركة العالمية اليومي المغلق:%0A";
                records.forEach(r => {
                    let colName = r.collector || "جابي 1";
                    msg += `- [${colName}] ${r.type}: ${r.amount} (${r.name}) [${r.status}]%0A`;
                });
                
                window.open(`https://wa.me/${companyWa}?text=` + msg, '_blank');
                
                localStorage.removeItem("shippData");
                loadTable();
                alert("تم إغلاق الصندوق وأرشفة البيانات بنجاح وتصفير اليومية.");
            }
        }
    </script>
</body>
</html>
