<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الشحن والحوالات - العالمية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #bf9b30; /* لون ذهبي مطابق للشعار */
            --primary-dark: #9a7f27;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 950px;
            margin: auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        /* --- منطقة الشعار --- */
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 12px;
        }
        .logo-container img {
            max-width: 180px; /* حجم مناسب للشعار */
            height: auto;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2)); /* تأثير ظل للشعار */
        }
        .logo-title {
            margin-top: 10px;
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }
        .logo-subtitle {
            font-size: 14px;
            color: #64748b;
        }
        /* --- تبديل الصلاحيات --- */
        .role-box {
            background: #fffbeb;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid #fde68a;
        }
        .role-box select {
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #fcd34d;
            font-weight: bold;
            background: white;
            color: var(--primary-dark);
        }
        /* --- أقسام النموذج والجدول --- */
        .form-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
        }
        .form-section h3 {
            margin-top: 0;
            color: #334155;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        input, select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(191, 155, 48, 0.1);
        }
        .btn {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-add { background-color: var(--success); color: white; width: 100%; }
        .btn-add:hover { background-color: #059669; }
        
        .manager-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .btn-pdf { background-color: var(--primary); color: white; }
        .btn-pdf:hover { background-color: var(--primary-dark); }
        .btn-close { background-color: var(--danger); color: white; }
        .btn-close:hover { background-color: #dc2626; }
        .btn-wa { background-color: #25d366; color: white; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn-wa:hover { background-color: #20ba5a; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
        }
        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
        }
        .status-green { color: var(--success); background: #ecfdf5; padding: 4px 10px; border-radius: 20px; display: inline-block; font-size: 13px; }
        .status-red { color: var(--danger); background: #fef2f2; padding: 4px 10px; border-radius: 20px; display: inline-block; font-size: 13px; }
        .action-btn {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            background: #e2e8f0;
            border: none;
            cursor: pointer;
        }
        .action-btn:hover { background: #cbd5e1; }
    </style>
</head>
<body>
    <div class="container" id="reportArea">
        <!-- منطقة الشعار الجديدة -->
        <div class="logo-container">
            <img src="image_1.png" alt="شعار العالمية">
            <div class="logo-title">العالمية</div>
            <div class="logo-subtitle">نظام إدارة الشحن والحوالات</div>
        </div>
        
        <!-- صندوق تبديل الصلاحيات -->
        <div class="role-box">
            <span>نوع المستخدم الحالي:</span>
            <select id="userRole" onchange="changeRole()">
                <option value="collector">جابي</option>
                <option value="manager">مدير</option>
            </select>
        </div>
        
        <!-- واجهة الجابي (الإدخال) -->
        <div id="collectorInterface" class="form-section">
            <h3>تسجيل حركة جديدة (وصل / مصروف / شحن)</h3>
            <div class="form-grid">
                <input type="text" id="itemName" placeholder="البيان (اسم المرسل أو الجهة)">
                <input type="number" id="itemAmount" placeholder="المبلغ (ليرة / دج)">
                <select id="itemType">
                    <option value="حوالة">حوالة</option>
                    <option value="مصروف">مصروف</option>
                    <option value="شحن">شحن</option>
                </select>
            </div>
            <button class="btn btn-add" onclick="addItem()">📥 إضافة للسجل وإرسال تنبيه للشركة</button>
        </div>

        <!-- لوحة تحكم المدير -->
        <div id="managerInterface" style="display:none;" class="form-section">
            <h3>لوحة تحكم المدير والتقارير</h3>
            <div class="manager-actions">
                <button class="btn btn-pdf" onclick="generatePDF()">📥 تصدير التقرير PDF</button>
                <button class="btn btn-close" onclick="closeBox()">🔒 إغلاق الصندوق (أرشفة يومية)</button>
                <a id="whatsappLink" href="#" target="_blank" class="btn btn-wa">💬 إرسال التقرير عبر واتساب</a>
            </div>
        </div>

        <h3>سجل العمليات والتقارير اليومية</h3>
        <table>
            <thead>
                <tr>
                    <th>النوع</th>
                    <th>البيان</th>
                    <th>المبلغ</th>
                    <th>حالة القبض</th>
                    <th>التاريخ والوقت</th>
                    <th>الإجراء (للمدير)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        function getRole() {
            return document.getElementById('userRole').value;
        }

        function changeRole() {
            const role = getRole();
            const managerUI = document.getElementById('managerInterface');
            const collectorUI = document.getElementById('collectorInterface');
            
            if (role === 'manager') {
                managerUI.style.display = 'block';
                collectorUI.style.display = 'none';
            } else {
                managerUI.style.display = 'none';
                collectorUI.style.display = 'block';
            }
            renderTable();
        }

        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const amount = document.getElementById('itemAmount').value.trim();
            const type = document.getElementById('itemType').value;
            const date = new Date().toLocaleString('ar-EG');
            
            if(!name || !amount) {
                alert('الرجاء إدخال البيان والمبلغ بشكل صحيح.');
                return;
            }

            let data = JSON.parse(localStorage.getItem('shipData') || '[]');
            data.push({name, amount, type, status: 'غير مقبوض', date});
            localStorage.setItem('shipData', JSON.stringify(data));
            
            alert('تم تسجيل الحركة بنجاح وإرسال تنبيه لرقم الشركة!');
            
            document.getElementById('itemName').value = '';
            document.getElementById('itemAmount').value = '';
            renderTable();
        }

        function toggleStatus(index) {
            if (getRole() !== 'manager') {
                alert('عذراً، صلاحيات الجابي لا تسمح بتغيير حالة القبض.');
                return;
            }
            let data = JSON.parse(localStorage.getItem('shipData') || '[]');
            data[index].status = data[index].status === 'مقبوض' ? 'غير مقبوض' : 'مقبوض';
            localStorage.setItem('shipData', JSON.stringify(data));
            renderTable();
        }

        function renderTable() {
            const body = document.getElementById('tableBody');
            const data = JSON.parse(localStorage.getItem('shipData') || '[]');
            const role = getRole();

            if (data.length === 0) {
                body.innerHTML = `<tr><td colspan="6" style="color: #94a3b8; padding: 20px;">لا توجد حركات مسجلة حتى الآن</td></tr>`;
                return;
            }

            body.innerHTML = data.map((item, index) => `
                <tr>
                    <td><strong>${item.type}</strong></td>
                    <td>${item.name}</td>
                    <td>${item.amount}</td>
                    <td><span class="${item.status === 'مقبوض' ? 'status-green' : 'status-red'}">${item.status}</span></td>
                    <td style="font-size: 13px; color: #64748b;">${item.date}</td>
                    <td>
                        ${role === 'manager' ? `<button class="action-btn" onclick="toggleStatus(${index})">تغيير الحالة</button>` : '<span style="color:#cbd5e1; font-size:12px;">للمدير فقط</span>'}
                    </td>
                </tr>
            `).join('');
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            html2canvas(document.getElementById('reportArea')).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                doc.addImage(imgData, 'PNG', 10, 10, 190, 170);
                doc.save('تقرير_العالمية_' + new Date().toLocaleDateString('ar-EG') + '.pdf');
            });
        }

        function closeBox() {
            if(confirm('هل أنت متأكد من إغلاق الصندوق وتصفير الأرشيف اليومي؟')) {
                localStorage.removeItem('shipData');
                renderTable();
                alert('تم إغلاق الصندوق وأرشفة اليومية بنجاح.');
            }
        }

        document.getElementById('whatsappLink').href = "https://wa.me/963999999999?text=" + encodeURIComponent("مرحباً، مرفق تقرير حركة الحوالات والمصاريف والشحن اليومي من شركة العالمية.");

        renderTable();
    </script>
</body>
</html>
