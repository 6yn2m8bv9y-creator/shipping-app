<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة العالمية - نظام الوصولات</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 400px; margin: 50px auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #004080; color: white; border: none; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #003366; }
        .error { color: red; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container" id="loginScreen">
    <h2>شركة العالمية</h2>
    <p style="text-align: center; color: #666;">إدارة: الحاج بلال عبد الرزاق</p>
    
    <div class="form-group">
        <label>اختر اسم الجابي:</label>
        <select id="collectorName">
            <option value="جابي 1">جابي 1</option>
            <option value="جابي 2">جابي 2</option>
        </select>
    </div>

    <div class="form-group">
        <label>كلمة المرور:</label>
        <input type="password" id="collectorPass" placeholder="أدخل كلمة المرور">
    </div>

    <button onclick="login()">تسجيل الدخول</button>
    <div id="errorMsg" class="error">كلمة المرور غير صحيحة!</div>
</div>

<script>
    // كلمة المرور الافتراضية الخاصة بـ جابي 1 وجابي 2 (يمكنك تغييرها هنا متى أردت)
    const passwords = {
        "جابي 1": "1234",
        "جابي 2": "1234"
    };

    function login() {
        const name = document.getElementById("collectorName").value;
        const pass = document.getElementById("collectorPass").value;
        const errorDiv = document.getElementById("errorMsg");

        if (pass === passwords[name]) {
            alert("تم تسجيل الدخول بنجاح يا " + name);
            // هون رح نضيف واجهة إدخال الوصولات والربط السحابي فور دخولك
        } else {
            errorDiv.style.display = "block";
        }
    }
</script>

</body>
</html>
